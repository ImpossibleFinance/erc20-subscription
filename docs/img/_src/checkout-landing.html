<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>checkout-landing</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body {
    width: 1200px;
    height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-grad-top) 0%, var(--bg-grad-bottom) 100%);
  }

  .frame {
    width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px 40px 32px;
    box-shadow: var(--shadow-card);
  }

  .wordmark {
    margin-bottom: 32px;
    color: var(--text-faint);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-family: var(--mono);
  }

  .heading {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .subhead {
    color: var(--text-faint);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .invoice {
    border-top: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .invoice .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .invoice .k {
    color: var(--text-faint);
    font-weight: 400;
  }
  .invoice .v {
    color: var(--text);
    font-weight: 500;
    text-align: right;
  }
  .invoice .v .sub {
    display: block;
    color: var(--text-faint);
    font-weight: 400;
    font-size: 12.5px;
    margin-top: 2px;
  }

  .cta {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 12px 16px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .cta:hover { background: var(--accent-hover); }

  .footer {
    margin-top: 24px;
    text-align: center;
    color: var(--text-faint);
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }
  .footer .dot { margin: 0 8px; color: #c1c9d2; }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">erc20-subscription</div>

    <h1 class="heading">Subscribe to Pro</h1>
    <p class="subhead">Monthly plan, paid in USDC. Cancel any time.</p>

    <div class="invoice">
      <div class="row">
        <span class="k">Plan</span>
        <span class="v">Pro</span>
      </div>
      <div class="row">
        <span class="k">First payment due today</span>
        <span class="v">49.00 USDC</span>
      </div>
      <div class="row">
        <span class="k">Future months</span>
        <span class="v">49.00 USDC<span class="sub">billed monthly</span></span>
      </div>
    </div>

    <button class="cta">Continue to checkout</button>

    <div class="footer">
      Powered by erc20-subscription <span class="dot">&middot;</span> Base Sepolia
    </div>
  </div>
</body>
</html>
