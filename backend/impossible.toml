app = "if-subs"

[machine]
cpu_kind = "shared"
cpus     = 1
memory   = 512

[http]
internal_port = 8080
auto_stop     = false
min_running   = 1
healthcheck   = "/healthz"

# Required env, all set via `ifhost secrets set` rather than checked in:
#   RPC_URL            — Base RPC (e.g. https://sepolia.base.org)
#   CHAIN_ID           — 8453 mainnet, 84532 sepolia
#   CONTRACT_ADDR      — deployed Subscriptions contract
#   TOKEN_ADDR         — USDC address (matches the contract's token())
#   OPERATOR_KEY_HEX   — hex-encoded private key for the operator EOA
#   REDIS_URL          — must be persistent + AOF-enabled
#   ADMIN_TOKEN        — bearer for /admin/*; rotate periodically
#   WEBHOOK_URL        — where to POST events (ifhost: /webhooks/subscriptions)
#   WEBHOOK_SECRET     — HMAC key; must match ifhost's SUBS_WEBHOOK_SECRET
#
# Optional (defaults are fine for v1):
#   TICK_INTERVAL=60s
#   ALLOWANCE_LOW_MONTHS=2
#   OPERATOR_GAS_BUFFER_MONTHS=1
#   OPERATOR_GAS_WARN_INTERVAL=6h
[env]
LISTEN_ADDR = ":8080"
